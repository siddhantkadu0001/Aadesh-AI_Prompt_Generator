<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Prompt Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5 20 7v10l-8 4.5L4 17V7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <circle cx="12" cy="12" r="2.4" fill="currentColor" />
      </svg>
      <span>Prompt Generator</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#generator">Generator</a>
      <a href="#result">Result</a>
      <a href="#history">History</a>
    </nav>
  </header>

  <section class="hero">
    <h1>AI Prompt<br />Generator</h1>
    <p class="subtitle">Pick a pattern, fill the fields, get a ready-to-use prompt</p>
    <span class="hero-line"></span>
  </section>

  <main class="flow">
    <section class="card" id="generator">
      <div class="card-head">
        <span class="badge">1</span>
        <h2>Choose &amp; fill</h2>
      </div>

      <label for="pattern">Prompt pattern</label>
      <select id="pattern"></select>
      <p id="patternDescription" class="muted"></p>

      <div id="fields"></div>

      <label for="systemOverride">System prompt (optional)</label>
      <input type="text" id="systemOverride" placeholder="Leave empty to use the default" />

      <div class="actions">
        <button id="generateBtn" type="button">Generate &rarr;</button>
      </div>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="card" id="result">
      <div class="card-head">
        <span class="badge">2</span>
        <h2>Your prompt</h2>
      </div>

      <label for="output">Generated prompt (you can edit it)</label>
      <textarea id="output" rows="12" placeholder="Your prompt will appear here"></textarea>

      <label for="systemOutput">System prompt</label>
      <textarea id="systemOutput" rows="2" readonly></textarea>

      <p id="temperature" class="muted"></p>

      <div class="actions">
        <button id="copyBtn" type="button">Copy</button>
        <button id="saveBtn" class="secondary" type="button">Save</button>
        <button id="exportTxtBtn" class="secondary" type="button">Export .txt</button>
        <button id="exportMdBtn" class="secondary" type="button">Export .md</button>
      </div>
    </section>

    <section class="card" id="history">
      <div class="card-head">
        <span class="badge">3</span>
        <h2>History</h2>
      </div>
      <div id="historyList"></div>
    </section>
  </main>

  <footer class="muted">Everything runs in your browser. Nothing you type is sent to a server.</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
